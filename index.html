<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Kit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Todo Kit</h1>
  </header>
  <main id="app">
    <form id="task-form">
      <input id="task-input" type="text" placeholder="What needs doing?" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="task-list"></ul>
    <div class="toolbar">
      <span id="counter"></span>
      <div id="filters">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="done">Done</button>
      </div>
      <button type="button" id="clear-done">Clear done</button>
    </div>
  </main>
  <footer><p>Built with vanilla JS</p></footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
